# Project-wide Gradle settings.
#
# Low-RAM (phone) build profile: one JVM only, capped workers and one aapt2 thread.
# Kotlin compiles in-process instead of in a second 2 GB daemon, so a full debug build
# peaks around 2 GB instead of the 4.5 GB the stock settings needed.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.useFallbackStrategy=false
# One task at a time keeps Kotlin, aapt2 and D8 from peaking together.
org.gradle.workers.max=1
org.gradle.parallel=false
# No file-watcher process on a memory-tight device.
org.gradle.vfs.watch=false
# The configuration cache adds heap pressure for no gain on a single incremental build.
org.gradle.configuration-cache=false
org.gradle.caching=true
# aapt2's thread pool defaults to 4; one thread is enough and much lighter.
android.aapt2ThreadPoolSize=1
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

android.nonTransitiveRClass=false

# Phone/arm64 build: AGP 9's bundled aapt2 is x86_64 and build-tools 34's aarch64 aapt2
# cannot read the API 37 resource table. Run the modern build-tools 37 aapt2 under qemu-user.
android.aapt2FromMavenOverride=/opt/aapt2-qemu/aapt2
