# Project-wide Gradle settings.
#
# Low-RAM (phone) build profile: one JVM, one worker, one aapt2 thread, and a heap that
# fits next to the apps the person is using. The device has ~5.6 GB of RAM in total and
# the desktop apps on it take most of that, so the build must not hold on to a large heap.
#
# -Xmx1280m + SerialGC + a small metaspace keeps the peak (Kotlin in-process, D8, aapt2)
# around 1.4 GB instead of the 2.5+ GB the stock settings needed. Kotlin compiles
# in-process instead of in a second 2 GB daemon, so there is only one JVM to pay for.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.useFallbackStrategy=false
# No incremental caches: they keep a copy of the sources in memory, which is the one
# thing this device cannot spare.
kotlin.incremental=false
# One task at a time keeps Kotlin, aapt2 and D8 from peaking together.
org.gradle.workers.max=1
org.gradle.parallel=false
# A single-use JVM: the build's memory is released when it ends instead of a daemon
# holding it for the rest of the session.
org.gradle.daemon=false
# No file-watcher process on a memory-tight device.
org.gradle.vfs.watch=false
# The configuration cache adds heap pressure for no gain on a single incremental build.
org.gradle.configuration-cache=false
org.gradle.caching=true
# aapt2's thread pool defaults to 4; one thread is enough and much lighter.
android.aapt2ThreadPoolSize=1
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

android.nonTransitiveRClass=false

# Phone/arm64 build: AGP 9's bundled aapt2 is x86_64 and build-tools 34's aarch64 aapt2
# cannot read the API 37 resource table. Run the modern build-tools 37 aapt2 under qemu-user.
android.aapt2FromMavenOverride=/opt/aapt2-qemu/aapt2
